name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    # glibc compatibility drives the matrix: build on the oldest supported
    # distro family so its binary runs everywhere upward. Each build is
    # published into its own registry group (el9 vs plain).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-image: fedora:latest
            group: false
          - os-image: rockylinux/rockylinux:9
            group: true
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.os-image }}
    steps:
      - name: install toolchain prerequisites
        run: |
          if command -v dnf5 >/dev/null 2>&1 || command -v dnf >/dev/null 2>&1; then
            dnf install -y curl git tar gzip
          fi
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: checkout
        uses: actions/checkout@v4

      - name: build (size-optimized release profile)
        run: cargo build --release

      - name: package rpm
        run: scripts/package.sh target/rpm

      - name: publish to forgejo registry + release
        env:
          FORGEJO_URL: https://git.home
          FORGEJO_OWNER: hnariman
          # el9 builds go into the el9 group so the two distro families
          # get separate dnf repos instead of one mixed index
          FORGEJO_GROUP: ${{ matrix.group && 'el9' || '' }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN }}
        run: |
          # same rpm name is rejected twice by the registry (409); a re-run of
          # an existing tag must not fail the whole job
          scripts/publish.sh target/rpm/*.rpm
